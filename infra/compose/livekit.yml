# livekit-server config for the LOCAL dev stack (infra/compose/dev.yml).
# Deterministic on purpose: fixed ports, the dev keypair, no external IP
# discovery — a laptop, not a cloud box (that config arrives in ms-10).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882          # single muxed UDP port: one -p line, no 50000-60000 range
  use_external_ip: false
redis:
  address: redis:6379
keys:
  devkey: secret
logging:
  level: info
