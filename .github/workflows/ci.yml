name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: ruff + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -m unit -q
