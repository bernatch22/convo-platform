[project]
name = "convo-platform"
version = "0.0.0"
description = "Multi-tenant conversational platform for contact centers on self-hosted LiveKit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
dependencies = [
    "livekit-agents[anthropic,deepgram,elevenlabs,silero,soniox]~=1.7",
    "anthropic>=0.41,<1",  # livekit-plugins-anthropic 1.7 passes httpx.AsyncClient; anthropic 1.x wants httpx2
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "deepeval>=3.0",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external services",
    "evals: tests that call an LLM judge (need provider keys)",
    "voice: tests that build STT/TTS sessions (keys kept in the unit ring)",
    "needs_llm: unit tests explicitly allowed to call the LLM",
]
